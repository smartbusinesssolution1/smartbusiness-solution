events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25M;

    upstream platform_api {
        server platform-api:3001;
    }

    upstream check_backend {
        server check-printing-backend:3005;
    }

    upstream clock_backend {
        server clockin-backend:3000;
    }

    upstream face_api {
        server face-recognition:8000;
    }

#    upstream rag_api {
#        server rag-chatbot:8000;
#    }

    upstream check_frontend {
        server check-printing-frontend:80;
    }

    upstream clock_frontend {
        server clockin-frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # ── Auth & Session API ──
        location /api/v1/auth {
            proxy_pass http://platform_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Check Printing API ──
        location /api/v1/ {
            proxy_pass http://check_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── ClockIn / Attendance Backend API ──
        location /attendance-api/ {
            rewrite ^/attendance-api/(.*) /$1 break;
            proxy_pass http://clock_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Facial Verification Microservice ──
        location /face-api/ {
            rewrite ^/face-api/(.*) /$1 break;
            proxy_pass http://face_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── RAG Chatbot Microservice (Commented out for now) ──
        # location /rag-api/ {
        #     rewrite ^/rag-api/(.*) /$1 break;
        #     proxy_pass http://rag_api;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_buffering off;
        #     proxy_cache off;
        # }

        # ── Attendance Web Frontend ──
        location /attendance/ {
            proxy_pass http://clock_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Check Printing Frontend (Client Portal) ──
        location / {
            proxy_pass http://check_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
