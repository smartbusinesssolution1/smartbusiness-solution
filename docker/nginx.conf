events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # ── Auth & Session API ──
        location /api/v1/auth {
            set $auth_api http://platform-api:3001;
            proxy_pass $auth_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Check Printing API ──
        location /api/v1/ {
            set $check_api http://check-printing-backend:3005;
            proxy_pass $check_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── ClockIn / Attendance Backend API ──
        location /attendance-api/ {
            rewrite ^/attendance-api/(.*) /$1 break;
            set $clock_api http://clockin-backend:3000;
            proxy_pass $clock_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Facial Verification Microservice ──
        location /face-api/ {
            rewrite ^/face-api/(.*) /$1 break;
            set $face_backend http://face-recognition:8000;
            proxy_pass $face_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Attendance Web Frontend ──
        location /attendance/ {
            set $clock_web http://clockin-frontend:8001;
            proxy_pass $clock_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Check Printing Frontend (Client Portal) ──
        location / {
            set $check_web http://check-printing-frontend:8002;
            proxy_pass $check_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
