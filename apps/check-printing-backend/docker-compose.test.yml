# Disposable Postgres, Redis and S3 for the integration tests. Data lives in memory (tmpfs),
# so every `up` starts empty and nothing touches the development database.
#   pnpm test:db:up     start it (waits until healthy)
#   pnpm test:db:down   stop and discard it
services:
  postgres-test:
    image: postgres:17-alpine
    container_name: check-printing-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: check_printing_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Durability is irrelevant for a throwaway database; this makes tests much faster.
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d check_printing_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Job queue (BullMQ) for the tests. Nothing is saved to disk; each test run
  # empties its own Redis database number before starting.
  redis-test:
    image: redis:7.4-alpine
    container_name: smartbusiness-test-redis
    ports:
      - "127.0.0.1:63790:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # An S3 imitation, so the S3 storage driver is tested against the real S3 API
  # without touching AWS. The test bucket exists from the start.
  s3-test:
    image: adobe/s3mock:3.12.0
    container_name: smartbusiness-test-s3
    environment:
      initialBuckets: check-printing-test
    ports:
      - "127.0.0.1:59090:9090"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/favicon.ico >/dev/null 2>&1 || curl -fsS http://localhost:9090/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
